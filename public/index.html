            width: 50vw; height: 50vw;

        /* Liquid Button Hover */
        .liquid-btn {
            position: relative; overflow: hidden; transition: all 0.4s ease;

        }
        .liquid-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease; z-index: -1;
        }
        .liquid-btn:hover::before { left: 100%; }
        .liquid-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(207, 169, 74, 0.3); }

        .ingredient-bubble {

        function CustomCursor() {
            const cursorRef = useRef(null);
            useEffect(() => {
                if (window.matchMedia("(pointer: coarse)").matches) return;
                let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;
                const onMouseMove = (e) => { mouseX = e.clientX; mouseY = e.clientY; };
                const loop = () => {
                    cursorX += (mouseX - cursorX) * 0.15; cursorY += (mouseY - cursorY) * 0.15;
                    if (cursorRef.current) cursorRef.current.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
                    requestAnimationFrame(loop);
                };
                window.addEventListener('mousemove', onMouseMove);
                requestAnimationFrame(loop);
                return () => window.removeEventListener('mousemove', onMouseMove);
            }, []);
            return (
                <div ref={cursorRef} className="fixed top-0 left-0 w-16 h-16 rounded-full pointer-events-none z-[9999] -ml-8 -mt-8 flex items-center justify-center transition-transform duration-300 ease-out hidden md:flex mix-blend-screen bg-[radial-gradient(circle,rgba(207,169,74,0.15)_0%,rgba(0,0,0,0)_70%)]" />
            );
        }

        function StarfieldBackground() {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current; const ctx = canvas.getContext('2d'); let animationFrameId; const stars = [];
                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initStars(); };
                const initStars = () => {
                    stars.length = 0; const starCount = Math.floor((canvas.width * canvas.height) / 1000);
                    for(let i=0; i<starCount; i++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 1.2, opacity: Math.random(), speed: (Math.random() * 0.01) });
                };
                const draw = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    stars.forEach(star => {
                        star.opacity += star.speed; if (star.opacity > 1 || star.opacity < 0.1) star.speed *= -1;
                        ctx.fillStyle = `rgba(207, 169, 74, ${star.opacity})`; ctx.beginPath();
                        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill();
                    });
                    animationFrameId = requestAnimationFrame(draw);
                };
                window.addEventListener('resize', resize); resize(); draw();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-50" />;
        }

        function Reveal({ children, delay = 0 }) {
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(entries => { entries.forEach(entry => { if (entry.isIntersecting) { setTimeout(() => setIsVisible(true), delay); observer.unobserve(entry.target); } }); }, { threshold: 0.1 });
                if (domRef.current) observer.observe(domRef.current);
                return () => observer.disconnect();
            }, [delay]);
            return <div ref={domRef} className={`transition-all duration-[1500ms] ease-[cubic-bezier(0.16,1,0.3,1)] w-full ${isVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-12 scale-95'}`}>{children}</div>;

        function ProfilerPage({ navigateTo }) {
            const [profilerStep, setProfilerStep] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [recommendation, setRecommendation] = useState(null);

            useEffect(() => { window.scrollTo(0,0); }, []);

            const handleProfileSelection = (stepIndex, value) => {
                const newAnswers = { ...userAnswers, [stepIndex]: value };
                setUserAnswers(newAnswers);
                
                if (profilerStep < PROFILER_STEPS.length - 1) {
                    setProfilerStep(profilerStep + 1);
                } else {
                    let counts = { A: 0, B: 0, C: 0, D: 0 };
                    Object.values(newAnswers).forEach(v => counts[v]++);
                    
                    let matchSlug = 'sunrise'; 
                    if (counts.D >= counts.A && counts.D >= counts.B && counts.D >= counts.C) {
                        const q2D = newAnswers[1] === 'D'; 
                        const q10D = newAnswers[9] === 'D'; 
                        if (counts.D >= 6 && (q2D || q10D)) matchSlug = '3-am-blues';
                        else if (counts.D >= 5 && counts.D <= 7) matchSlug = 'midnight';
                        else matchSlug = 'nightfall';
                    } else {
                        if (counts.A >= counts.B && counts.A >= counts.C) matchSlug = 'sunrise';
                        else if (counts.B >= counts.A && counts.B >= counts.C) matchSlug = 'noon';
                        else matchSlug = 'eve';
                    }
                    
                    const match = PRODUCTS.find(p => p.slug === matchSlug);
                    setRecommendation(match);
                    setProfilerStep(PROFILER_STEPS.length);
                }
            };

            return (
                <section className="min-h-screen flex items-center justify-center pt-24 px-6 bg-transparent relative z-10 animate-in fade-in duration-700">

                            {profilerStep < PROFILER_STEPS.length ? (
                                <div className="relative z-10 animate-in slide-in-from-right-8 duration-300">
                                    <div className="flex justify-between items-center mb-6">
                                        <p className="text-[10px] uppercase tracking-[0.8em] text-[#CFA94A] font-sans font-bold">The Alchemist's Inquiry</p>
                                        <p className="text-[10px] text-stone-500 font-sans">{profilerStep + 1} / 10</p>
                                    </div>
                                    <h2 className="text-2xl md:text-3xl font-light tracking-widest mb-12 text-[#CFA94A] font-cinzel leading-relaxed">{PROFILER_STEPS[profilerStep].question}</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {PROFILER_STEPS[profilerStep].options.map((opt, i) => (
                                            <button 
                                                key={opt.label}
                                                onClick={() => handleProfileSelection(profilerStep, opt.value)}
                                                className="flex items-center gap-4 p-6 border border-stone-800 bg-[#161616]/80 hover:border-[#CFA94A] hover:bg-gradient-to-r hover:from-[#d9772b]/10 hover:to-[#CFA94A]/10 transition-all text-left group transform hover:scale-[1.02] rounded-md backdrop-blur-sm"
                                            >
                                                <div className="w-8 h-8 shrink-0 rounded-full border border-stone-700 flex items-center justify-center text-[#CFA94A] group-hover:bg-[#CFA94A] group-hover:text-black transition-all font-cinzel text-xs">{['A','B','C','D'][i]}</div>
                                                <span className="text-xs uppercase tracking-widest font-sans font-medium text-stone-300">{opt.label}</span>
                                            </button>
                                        ))}
                                    </div>

        function UserDashboard({ navigateTo, user, setUser, orders }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [isLoginView, setIsLoginView] = useState(true);
            const [nameInput, setNameInput] = useState('');
            const [emailInput, setEmailInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [authError, setAuthError] = useState('');

            useEffect(() => { 
                window.scrollTo(0,0); 
                if (supabase) {
                    supabase.auth.getSession().then(({ data: { session } }) => {
                        if (session) fetchUserProfile(session.user.id, session.user.email);
                    });
                }
            }, []);

            const fetchUserProfile = async (userId, email) => {
                if (!supabase) return;
                try {
                    const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
                    if (data) {
                        setUser({ id: userId, name: data.name, email: data.email, points: data.points, totalSpent: data.total_spent, referralCode: data.referral_code });
                    } else if (error && error.code === 'PGRST116') {
                        // Profile doesn't exist yet, create a fallback
                        setUser({ id: userId, name: "Member", email: email, points: 0, totalSpent: 0, referralCode: generateReferralCode("MEMBER") });
                    }
                } catch(err) { console.error("Profile fetch error:", err); }
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setIsSubmitting(true);

                if (!supabase) {
                    // Offline Simulation Fallback
                    setTimeout(() => {
                        setUser({ name: nameInput || 'Guest Member', email: emailInput, points: 0, totalSpent: 0, referralCode: generateReferralCode(nameInput || 'GST') });
                        setIsSubmitting(false);
                    }, 800);
                    return;
                }

                try {
                    if (isLoginView) {
                        const { data, error } = await supabase.auth.signInWithPassword({ email: emailInput, password: passwordInput });
                        if (error) throw error;
                        if (data.user) fetchUserProfile(data.user.id, data.user.email);
                    } else {
                        if (!nameInput.trim()) throw new Error("Name is required for registration.");
                        const { data, error } = await supabase.auth.signUp({ email: emailInput, password: passwordInput });
                        if (error) throw error;
                        if (data.user) {
                            const newProfile = { id: data.user.id, name: nameInput, email: emailInput, points: 0, total_spent: 0, referral_code: generateReferralCode(nameInput) };
                            const { error: insertError } = await supabase.from('profiles').insert([newProfile]);
                            if (insertError) throw insertError;
                            setUser({ id: data.user.id, name: nameInput, email: emailInput, points: 0, totalSpent: 0, referralCode: newProfile.referral_code });
                        }
                    }
                } catch(err) {
                    setAuthError(err.message);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleSignOut = async () => {
                if (supabase) await supabase.auth.signOut();
                setUser(null);
                navigateTo('home');
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center pt-24 px-6 bg-transparent relative animate-in zoom-in-95 duration-1000">

                            <div className="flex gap-4 mb-8 relative z-10">

                                <button onClick={() => {setIsLoginView(false); setAuthError('');}} className={`flex-1 pb-2 text-[10px] uppercase tracking-widest font-bold transition-all border-b-2 ${!isLoginView ? 'border-[#CFA94A] text-[#CFA94A]' : 'border-transparent text-stone-500'}`}>Create Account</button>
                            </div>

                            <form onSubmit={handleAuth} className="relative z-10 space-y-4 font-sans">

                                    <div>
                                        <label className="text-[9px] uppercase tracking-widest text-stone-500 mb-2 block">Full Name</label>
                                        <input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value)} placeholder="Enter your full name" className="w-full bg-black/50 border border-stone-700 p-4 text-sm text-white focus:outline-none focus:border-[#CFA94A] transition-colors rounded-sm" required={!isLoginView} />
                                    </div>
                                )}
                                <div>
                                    <label className="text-[9px] uppercase tracking-widest text-stone-500 mb-2 block">Email Address</label>
                                    <input type="email" value={emailInput} onChange={(e) => setEmailInput(e.target.value)} placeholder="you@example.com" className="w-full bg-black/50 border border-stone-700 p-4 text-sm text-white focus:outline-none focus:border-[#CFA94A] transition-colors rounded-sm" required />
                                </div>
                                <div>
                                    <label className="text-[9px] uppercase tracking-widest text-stone-500 mb-2 block">Password</label>
                                    <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} placeholder="••••••••" className="w-full bg-black/50 border border-stone-700 p-4 text-sm text-white focus:outline-none focus:border-[#CFA94A] transition-colors rounded-sm" required />
                                </div>
                                {authError && <p className="text-red-500 text-[10px] uppercase tracking-widest pt-2 text-center">{authError}</p>}

                                    {isSubmitting ? 'Authenticating...' : (isLoginView ? 'Enter Atelier' : 'Join Society')}

                                        </div>

                            )}

                            {activeTab === 'orders' && (
                                <div className="space-y-8 animate-in slide-in-from-right-8 font-sans relative z-10">
                                    <h2 className="text-2xl font-cinzel text-[#CFA94A] border-b border-stone-800 pb-4">Order Archives</h2>
                                    <div className="space-y-4">
                                        {userOrders.length === 0 && <p className="text-stone-500 text-sm">You have no past orders in the archive.</p>}
                                        {userOrders.map(o => (
                                            <div key={o.id} className="p-6 border border-stone-800 bg-[#161616]/80 flex flex-col md:flex-row gap-6 justify-between items-start md:items-center rounded-sm">
                                                <div>
                                                    <p className="text-[10px] uppercase tracking-widest text-stone-500 mb-1 font-sans">Order #{o.id}</p>
                                                    <p className="text-lg text-white font-cinzel mb-1">{o.items[0].name} {o.items.length > 1 ? `+${o.items.length - 1} items` : ''}</p>
                                                    <p className="text-xs text-stone-400 font-sans">Total: {formatPrice(o.total)}</p>
                                                </div>
                                                <div className="flex flex-col items-end gap-2 w-full md:w-auto font-sans">
                                                    <span className={`px-3 py-1 border text-[9px] uppercase tracking-widest rounded-sm ${o.status === 'delivered' ? 'border-green-500/40 text-green-400 bg-green-500/10' : 'border-[#CFA94A]/30 text-[#CFA94A] bg-[#CFA94A]/20'}`}>{o.status}</span>
                                                    <button className="text-[10px] uppercase tracking-widest text-stone-400 hover:text-white underline underline-offset-4">View Invoice</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'vault' && (
                                <div className="space-y-8 animate-in slide-in-from-right-8 relative z-10">
                                    <div className="flex justify-between items-end border-b border-stone-800 pb-4">
                                        <h2 className="text-2xl font-cinzel text-[#CFA94A]">The Reward Vault</h2>
                                        <p className="text-[10px] uppercase tracking-widest text-stone-500 font-sans">Available Balance: {user.points} pts</p>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-sans">
                                        {[{ title: 'Imperial Satin (10ml Sample)', pts: 500, desc: 'A pocket-sized exclusivity.' }, { title: 'Early Access: Velvet Midnight', pts: 1000, desc: 'Unlock our unreleased masterpiece 48 hours early.' }, { title: 'Bespoke Bottle Engraving', pts: 2500, desc: 'Add personalized initials to your next full-size order.' }, { title: 'Private Atelier Consultation', pts: 5000, desc: 'A 1-on-1 virtual layering masterclass with our perfumer.' }].map(reward => (
                                            <div key={reward.title} className="p-6 border border-stone-800 bg-[#161616]/80 flex flex-col justify-between rounded-sm">
                                                <div>
                                                    <h3 className="text-sm font-bold text-white mb-2 tracking-wide">{reward.title}</h3>
                                                    <p className="text-xs text-stone-400 mb-6">{reward.desc}</p>
                                                </div>
                                                <div className="flex justify-between items-center pt-4 border-t border-white/5">
                                                    <span className="text-[10px] text-[#CFA94A] tracking-widest uppercase font-bold">{reward.pts} PTS</span>
                                                    <button disabled={user.points < reward.pts} className="text-[9px] uppercase tracking-[0.2em] text-black bg-[#CFA94A] px-4 py-2 hover:bg-white transition-all font-bold disabled:opacity-30 disabled:bg-stone-600 disabled:text-stone-400 rounded-sm">Redeem</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'society' && (
                                <div className="space-y-8 animate-in slide-in-from-right-8 font-sans relative z-10">
                                    <h2 className="text-2xl font-cinzel text-[#CFA94A] border-b border-stone-800 pb-4">Luminous Society</h2>
                                    <div className={`p-8 bg-[#161616]/80 border border-[#CFA94A]/30 text-center relative overflow-hidden rounded-sm ${tierClass}`}>
                                        <div className="absolute inset-0 bg-gradient-to-b from-[#CFA94A]/10 to-transparent pointer-events-none" />
                                        <div className="relative z-10">
                                            <div className="w-16 h-16 rounded-full border border-[#CFA94A] mx-auto mb-4 flex items-center justify-center bg-gradient-to-br from-[#d9772b]/10 to-[#CFA94A]/10"><BrandLogo size={24} className="text-[#CFA94A]" /></div>
                                            <h3 className="text-xl tracking-[0.3em] mb-1 uppercase text-[#CFA94A] font-cinzel">{tierName} Member</h3>
                                            <p className="text-3xl font-light tracking-widest text-[#d9772b] mb-1">{user.points}</p>
                                            <p className="text-[9px] tracking-[0.2em] text-stone-400 uppercase font-bold">Stardust Credits</p>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        {[{ name: 'Crescent', req: '10,000 PKR', perk: 'Growing Tier: 1.2x Point Multiplier & early drops.', active: user.totalSpent >= 10000 && user.totalSpent < 25000 }, { name: 'Eclipse', req: '25,000 PKR', perk: 'Advanced Tier: 1.5x Point Multiplier & free shipping.', active: user.totalSpent >= 25000 && user.totalSpent < 50000 }, { name: 'Celestial', req: '50,000 PKR', perk: 'Elite Tier: 2.0x Point Multiplier & bespoke formulation.', active: user.totalSpent >= 50000 }].map((t) => (
                                            <div key={t.name} className={`p-4 border rounded-sm ${t.active ? 'border-[#CFA94A] bg-[#CFA94A]/5' : 'border-stone-800 bg-[#111]/80'} flex justify-between items-center transition-all`}>
                                                <div>
                                                    <h4 className={`text-xs tracking-[0.3em] uppercase mb-1 font-bold ${t.active ? 'text-[#CFA94A]' : 'text-stone-300'}`}>{t.name}</h4>
                                                    <p className="text-[10px] text-stone-500 tracking-wider">{t.perk}</p>
                                                </div>
                                                <p className="text-[9px] text-[#CFA94A] tracking-widest uppercase font-bold">{t.req}</p>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-6 border border-dashed border-[#CFA94A]/30 bg-[#CFA94A]/5 rounded-sm">
                                        <h4 className="text-[10px] tracking-[0.3em] uppercase mb-3 text-[#CFA94A] font-bold">Referral Program</h4>
                                        <p className="text-xs text-stone-400 mb-4 leading-relaxed">Invite a friend to the Atelier using your unique code. When their first order is delivered, they receive +100 welcome points, and you receive +300 points.</p>
                                        <div className="flex justify-between items-center bg-black border border-stone-800 p-3">
                                            <span className="text-xs font-mono tracking-widest text-[#CFA94A]">{user.referralCode}</span>
                                            <button className="text-[9px] uppercase tracking-[0.2em] text-white hover:text-[#CFA94A] transition-all font-bold">Copy Code</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 6. MAIN APP ORCHESTRATOR
        // ==========================================
        function App() {
            const [view, setView] = useState('home');
            const [isScrolled, setIsScrolled] = useState(false);
            const [scrollY, setScrollY] = useState(0);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            const [currentUser, setCurrentUser] = useState(null); 
            const [orders, setOrders] = useState([]); 
            const [cartItems, setCartItems] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            
            const [isNotifyOpen, setIsNotifyOpen] = useState(false);
            const [notifyData, setNotifyData] = useState({ title: '', message: '' });
            const [localCheckoutFallbackData, setLocalCheckoutFallbackData] = useState(null);
            
            const [isTouchDevice, setIsTouchDevice] = useState(false);
            const scrollContainerRef = useRef(null);

            const cartCount = cartItems.reduce((sum, item) => sum + item.qty, 0);

            const addToCart = (product, size) => {
                setCartItems(prev => {
                    const existing = prev.find(item => item.product.id === product.id && item.size === size);
                    if (existing) return prev.map(item => item.product.id === product.id && item.size === size ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { product, size, price: product.prices[size], qty: 1 }];
                });
                setIsCartOpen(true);
            };

            const updateQuantity = (index, delta) => {
                setCartItems(prev => {
                    const newItems = [...prev];
                    const item = newItems[index];
                    if (item.qty + delta > 0) item.qty += delta;
                    else newItems.splice(index, 1);
                    return newItems;
                });
            };

            const removeItem = (index) => { setCartItems(prev => prev.filter((_, i) => i !== index)); };

            const completeOrder = async (total, formData) => {
                setLocalCheckoutFallbackData({ total, formData }); 

                if (SHOPIFY_STOREFRONT_TOKEN.startsWith("YOUR_")) {
                    setNotifyData({ title: "Headless System Mode", message: "Your checkout is configured for production. Adding valid Shopify Variant IDs and your API token will securely redirect to your live checkout. Proceeding with simulated order..." });
                    setIsNotifyOpen(true);
                    return;
                }

                const lineItems = cartItems.map(item => {
                    let vId = item.product.shopifyVariantIds?.[item.size] || "gid://shopify/ProductVariant/MOCK_ID";
                    if (!vId.startsWith("gid://")) {
                        try { vId = atob(vId); } catch(e) {}
                    }
                    return {
                        merchandiseId: vId,
                        quantity: item.qty
                    };
                });

                const query = `
                    mutation cartCreate($input: CartInput!) {
                        cartCreate(input: $input) {
                            cart { checkoutUrl }
                            userErrors { message }
                        }
                    }
                `;

                const variables = {
                    input: {
                        lines: lineItems,
                        buyerIdentity: { email: formData.email }
                    }
                };

                try {
                    const response = await fetch(`https://${SHOPIFY_STORE_DOMAIN}/api/2024-01/graphql.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': SHOPIFY_STOREFRONT_TOKEN },
                        body: JSON.stringify({ query, variables })
                    });

                    const json = await response.json();
                    
                    if (json.data && json.data.cartCreate && json.data.cartCreate.cart) {
                        saveLocalOrder(total);
                        window.location.href = json.data.cartCreate.cart.checkoutUrl;
                    } else {
                        const errors = json.data?.cartCreate?.userErrors || json.errors;
                        const errorMsg = errors && errors.length > 0 ? errors[0].message : "Please verify your Storefront Variant IDs are published to the Headless Channel.";
                        setNotifyData({ title: "Variant Sync Required", message: `Shopify Connected! However, Variant configuration returned: "${errorMsg}"` });
                        setIsNotifyOpen(true);
                    }
                } catch (error) {
                    setNotifyData({ title: "Connection Offline", message: "Failed to connect to Shopify Storefront API. Falling back to local offline simulation..." });
                    setIsNotifyOpen(true);
                }
            };

            const saveLocalOrder = (totalAmount) => {
                const newOrder = { id: generateOrderId(), customer: currentUser ? currentUser.name : "Guest", date: new Date().toLocaleDateString(), items: [...cartItems], total: totalAmount, status: 'pending' };
                setOrders(prev => [newOrder, ...prev]);
                if (currentUser) setCurrentUser(prev => ({ ...prev, totalSpent: prev.totalSpent + totalAmount }));
                setCartItems([]);
            };

            const triggerLocalConfirm = () => {
                setIsNotifyOpen(false);
                if (localCheckoutFallbackData) saveLocalOrder(localCheckoutFallbackData.total);
                navigateTo('order-success');
            };

            const updateOrderStatus = (orderId, newStatus) => {
                setOrders(prev => prev.map(o => {
                    if (o.id === orderId && o.status !== 'delivered' && newStatus === 'delivered') {
                        if (currentUser && o.customer === currentUser.name) {
                            const currentSpent = currentUser.totalSpent;
                            let multiplier = 1;
                            if (currentSpent >= 50000) multiplier = 2; else if (currentSpent >= 25000) multiplier = 1.5; else if (currentSpent >= 10000) multiplier = 1.2; 
                            const earnedPoints = Math.floor(Math.floor(o.total / 100) * multiplier);
                            setCurrentUser(prevU => ({ ...prevU, points: prevU.points + earnedPoints }));
                        }
                    }
                    return o.id === orderId ? { ...o, status: newStatus } : o;
                }));
            };

            useEffect(() => {
                const handleHashChange = () => {
                    const newView = window.location.hash.replace('#', '') || 'home';
                    setView(newView);
                    window.scrollTo(0,0);
                };
                handleHashChange();
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                const isTouch = window.matchMedia("(pointer: coarse)").matches;
                setIsTouchDevice(isTouch);
                if (isTouch) {
                    const handleScroll = () => { setIsScrolled(window.scrollY > 50); setScrollY(window.scrollY); };
                    window.addEventListener('scroll', handleScroll);
                    return () => window.removeEventListener('scroll', handleScroll);
                }

                let current = 0; let target = 0; const ease = 0.08; let reqId;
                const setBodyHeight = () => { if(scrollContainerRef.current && !isCartOpen) document.body.style.height = `${scrollContainerRef.current.getBoundingClientRect().height}px`; };
                window.addEventListener('resize', setBodyHeight); setTimeout(setBodyHeight, 500); 
                const scrollHandler = () => { target = window.scrollY; }; window.addEventListener('scroll', scrollHandler);

                const smoothScroll = () => {
                    current += (target - current) * ease;
                    setIsScrolled(current > 50); setScrollY(current);
                    if (scrollContainerRef.current && !isCartOpen) scrollContainerRef.current.style.transform = `translate3d(0, -${current}px, 0)`;
                    reqId = requestAnimationFrame(smoothScroll);
                };
                reqId = requestAnimationFrame(smoothScroll);
                return () => { window.removeEventListener('resize', setBodyHeight); window.removeEventListener('scroll', scrollHandler); cancelAnimationFrame(reqId); document.body.style.height = 'auto'; };
            }, [view, isCartOpen]);

            const navigateTo = (newHash) => { window.location.hash = newHash; setMobileMenuOpen(false); window.scrollTo(0,0); };

            const renderView = () => {
                if (view.startsWith('product/')) {
                    const product = PRODUCTS.find(p => p.slug === view.split('/')[1]);
                    return <ProductViewPage product={product} navigateTo={navigateTo} addToCart={addToCart} />;
                }
                switch(view) {
                    case 'story': return <StoryPage navigateTo={navigateTo} />;
                    case 'catalog': return <CatalogPage navigateTo={navigateTo} />;
                    case 'checkout': return <CheckoutPage cartItems={cartItems} navigateTo={navigateTo} completeOrder={completeOrder} />;
                    case 'order-success': return <OrderSuccess navigateTo={navigateTo} />;
                    case 'dashboard': return <UserDashboard navigateTo={navigateTo} user={currentUser} setUser={setCurrentUser} orders={orders} />;
                    case 'offers': return <OffersPage navigateTo={navigateTo} addToCart={addToCart} />;
                    case 'admin': return <AdminPanel orders={orders} updateOrderStatus={updateOrderStatus} />;
                    case 'profiler': return <ProfilerPage navigateTo={navigateTo} />;
                    case 'privacy': return <PrivacyPolicyPage />;
                    case 'terms': return <TermsOfServicePage />;
                    default: return <HomePage navigateTo={navigateTo} />;
                }
            };

            return (
                <div className={`bg-[#000000] text-stone-300 font-serif selection:bg-[#CFA94A]/40 selection:text-white relative ${isTouchDevice || isCartOpen ? 'overflow-x-hidden' : 'overflow-hidden cursor-none'}`}>
                    <CustomCursor />
                    <StarfieldBackground />
                    <ShoppingBag isOpen={isCartOpen} onClose={() => setIsCartOpen(false)} cartItems={cartItems} updateQuantity={updateQuantity} removeItem={removeItem} navigateTo={navigateTo} />
                    <CustomNotificationModal isOpen={isNotifyOpen} title={notifyData.title} message={notifyData.message} onClose={() => setIsNotifyOpen(false)} onAction={triggerLocalConfirm} actionText="Local Simulation Checkout" />
                    
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-700 px-6 py-5 flex justify-between items-center ${isScrolled || view !== 'home' ? 'bg-[#000000]/90 backdrop-blur-xl border-b border-[#CFA94A]/10 shadow-2xl' : 'bg-transparent'}`}>
                        <div className="text-lg tracking-[0.3em] font-medium text-[#CFA94A] flex items-center gap-3 font-cinzel hover:scale-[1.02] transition-transform cursor-pointer" onClick={() => navigateTo('home')}>
                            <BrandLogo className="w-8 h-8 text-[#CFA94A] animate-pulse" /> ILLUMINEIRE
                        </div>
                        <div className="hidden lg:flex items-center gap-6 text-[9px] uppercase tracking-[0.2em] font-sans font-medium text-stone-400">
                            <button onClick={() => navigateTo('home')} className="hover:text-[#CFA94A] transition-colors">HOME</button>
                            <button onClick={() => navigateTo('story')} className="hover:text-[#CFA94A] transition-colors">STORY</button>
                            <button onClick={() => navigateTo('catalog')} className="hover:text-[#CFA94A] transition-colors">FRAGRANCES</button>
                            <button onClick={() => navigateTo('offers')} className="hover:text-[#CFA94A] transition-colors">OFFERS</button>
                            <button onClick={() => navigateTo('profiler')} className="hover:text-[#CFA94A] transition-colors">RESERVE</button>
                            <button onClick={() => navigateTo('dashboard')} className="hover:text-[#CFA94A] transition-colors flex items-center gap-1"><UserIcon size={12} /> ATELIER</button>
                            <button onClick={() => setIsCartOpen(true)} className="hover:text-[#CFA94A] transition-colors flex items-center gap-1 relative ml-2">
                                <ShoppingBagIcon size={16} />
                                {cartCount > 0 && <span className="absolute -top-2 -right-2 bg-[#CFA94A] text-black w-4 h-4 rounded-full flex items-center justify-center text-[8px] font-bold font-sans">{cartCount}</span>}
                            </button>
                            <button onClick={() => navigateTo('dashboard')} className="liquid-btn bg-gradient-to-r from-[#d9772b] to-[#CFA94A] hover:from-[#c26622] hover:to-[#b8953f] text-white px-5 py-2 transition-all ml-2 tracking-widest shadow-[0_0_15px_rgba(207,169,74,0.3)] rounded-md">SOCIETY</button>
                        </div>
                        <div className="lg:hidden flex items-center gap-5">
                            <button onClick={() => setIsCartOpen(true)} className="text-[#CFA94A] relative">
                                <ShoppingBagIcon size={20} />
                                {cartCount > 0 && <span className="absolute -top-2 -right-2 bg-[#CFA94A] text-black w-4 h-4 rounded-full flex items-center justify-center text-[8px] font-bold font-sans">{cartCount}</span>}
                            </button>
                            <button className="text-[#CFA94A]" onClick={() => navigateTo('dashboard')}><UserIcon size={20} /></button>
                            <button className="text-[#CFA94A]" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>{mobileMenuOpen ? <XIcon size={24} /> : <MenuIcon size={24} />}</button>
                        </div>
                    </nav>

                    {mobileMenuOpen && (
                        <div className="fixed inset-0 z-40 bg-[#000000]/95 backdrop-blur-3xl pt-24 px-6 flex flex-col gap-6 text-sm tracking-[0.2em] uppercase font-sans animate-in slide-in-from-top duration-500">
                            <button onClick={() => navigateTo('home')} className="text-left text-stone-400 hover:text-[#CFA94A] border-b border-white/5 pb-4">Home</button>
                            <button onClick={() => navigateTo('story')} className="text-left text-stone-400 hover:text-[#CFA94A] border-b border-white/5 pb-4">Story</button>
                            <button onClick={() => navigateTo('catalog')} className="text-left text-stone-400 hover:text-[#CFA94A] border-b border-white/5 pb-4">Fragrances</button>
                            <button onClick={() => navigateTo('offers')} className="text-left text-stone-400 hover:text-[#CFA94A] border-b border-white/5 pb-4">Special Offers</button>
                            <button onClick={() => navigateTo('profiler')} className="text-left text-stone-400 hover:text-[#CFA94A] border-b border-white/5 pb-4">Reserve (Taste Profiler)</button>
                            <button onClick={() => navigateTo('dashboard')} className="text-left text-stone-400 hover:text-[#CFA94A] border-b border-white/5 pb-4 flex items-center gap-2"><UserIcon size={16}/> Account Dashboard</button>
                        </div>
                    )}

                    <div className={`w-full ${isTouchDevice || isCartOpen ? '' : 'fixed top-0 left-0'}`} ref={scrollContainerRef}>
                        {renderView()}

                        {/* --- Footer --- */}
                        {!view.startsWith('product/') && view !== 'checkout' && view !== 'order-success' && view !== 'dashboard' && view !== 'offers' && view !== 'admin' && view !== 'profiler' && view !== 'privacy' && view !== 'terms' && (
                            <footer className="bg-[#000000]/90 backdrop-blur-xl pt-24 pb-12 px-6 md:px-12 lg:px-24 border-t border-[#CFA94A]/20 text-stone-400 font-sans relative z-10 mt-auto">
                                <Reveal>
                                    <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-12 mb-20 font-sans">
                                        <div className="md:col-span-1">
                                            <div className="text-lg tracking-[0.3em] font-medium text-[#CFA94A] mb-4 font-cinzel flex items-center gap-3"><BrandLogo /> ILLUMINEIRE</div>
                                            <p className="text-sm italic text-stone-300 mb-2 font-serif">Let the light in.</p>
                                            <p className="text-[10px] tracking-widest uppercase font-light text-stone-500">A Pakistan Based Luxury Fragrance Brand.</p>
                                        </div>
                                        <div>
